name: prism-emulator

# Start a session: push a new control/start.json to the prism-emulator branch.
# The job boots an Android emulator, installs the published Prism app and then
# executes commands that Claude writes to the prism-emulator-bridge branch.
on:
  push:
    branches: [prism-emulator]
    paths: [control/start.json]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prism-emulator
  cancel-in-progress: false

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prism-emulator

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Download the published Prism app
        run: python3 tools/get_apk.py

      - name: Run emulator and command bridge
        uses: reactivecircus/android-emulator-runner@v2
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_7
          ram-size: 4096M
          disk-size: 6000M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          script: python3 tools/bridge.py
